[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ccd-profiles"
dynamic = ["version"]
description = "Browse, copy and sync Claude Desktop Code-tab sessions across profiles and accounts (macOS)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "GoDiao" }]
keywords = ["claude", "claude-code", "claude-desktop", "tui", "sessions"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/GoDiao/ccd-profiles"
Issues = "https://github.com/GoDiao/ccd-profiles/issues"

[project.scripts]
ccd-profiles = "ccd_profiles:main"

[tool.setuptools]
py-modules = ["ccd_profiles"]

[tool.setuptools.dynamic]
version = { attr = "ccd_profiles.__version__" }
